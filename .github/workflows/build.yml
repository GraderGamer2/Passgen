name: build
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04          # older glibc, so the binary runs on more distros
    steps:
      - uses: actions/checkout@v4
      - run: sh linux/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: passgen-linux, path: linux/passgen }
  android:
    runs-on: ubuntu-latest         # ships with the Android SDK, JDK and zip
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}        # optional: your own signing key
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > release.jks; export KS=release.jks; fi
          sh build.sh
      - uses: actions/upload-artifact@v4
        with: { name: passgen-apk, path: android/passgen.apk }
  release:                         # runs when you push a tag like v1.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/passgen-linux/passgen dist/passgen-linux-x86_64
          mv dist/passgen-apk/passgen.apk dist/passgen.apk
          gh release create "$GITHUB_REF_NAME" dist/passgen-linux-x86_64 dist/passgen.apk --repo "$GITHUB_REPOSITORY" --generate-notes
